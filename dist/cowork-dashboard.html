<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abita · Finanzas</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light;
  --o:#FF4D00;--o2:#FF6220;--o3:#F04400;--od:#B33500;--ol:#FFE5DB;
  --k:#000;--ink:#1A1A1A;--cream:#EBE4D6;--cream2:#F4EFE6;--mut:#B8B0A3;--g:#6F6F6F;--line:#E1D9C9;
  --ok:#1F9D55;--okl:#4ADE80;--bad:#D7263D;--badl:#FF6B7A;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);font-family:var(--f);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
svg.logo{height:20px;width:auto;color:var(--cream);display:block}

/* ---------- barra superior (vidrio oscuro) ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 28px;
  background:rgba(8,8,8,.88);backdrop-filter:blur(26px) saturate(1.9);-webkit-backdrop-filter:blur(26px) saturate(1.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 34px rgba(0,0,0,.42);border-bottom:1px solid rgba(255,255,255,.06)}
.top .tag{color:var(--mut);font-weight:600;font-size:14px;padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}
.top{padding-top:calc(14px + env(safe-area-inset-top));padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
.top .sp{flex:1}
.month{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07)}
.month button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--cream);font-size:18px;cursor:pointer}
.month button:hover{background:rgba(255,255,255,.1)}
.month span{min-width:140px;text-align:center;font-weight:700;color:var(--cream);font-size:14px}

/* ---------- botones ---------- */
.btn{font:inherit;font-weight:600;font-size:15px;letter-spacing:-.01em;border-radius:12px;padding:11px 18px;cursor:pointer;border:1px solid transparent;color:#000;
  background:linear-gradient(#FF6220 0%,#FF4D00 46%,#F04400 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 3px rgba(255,77,0,.24),0 6px 16px rgba(255,77,0,.26),0 18px 40px rgba(255,77,0,.18);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.glass{color:var(--cream);background:rgba(255,255,255,.055);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.36)}
.btn.light{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.05)}
.btn.danger{color:#fff;background:var(--bad);box-shadow:0 6px 16px rgba(215,38,61,.25)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}

/* ---------- hero oscuro ---------- */
.hero{position:relative;overflow:hidden;background:#000;color:var(--cream);padding:46px 28px 30px}
.hero::before{content:"";position:absolute;right:-12%;top:-30%;width:70%;height:150%;
  background:radial-gradient(closest-side,rgba(255,77,0,.28),rgba(255,77,0,.08) 55%,transparent 75%);pointer-events:none}
.hero .mark{position:absolute;right:-60px;bottom:-80px;width:620px;color:#FF4D00;opacity:.07;pointer-events:none}
.wrap{max-width:1280px;margin:0 auto;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#FFB28F;
  padding:7px 14px;border-radius:999px;background:rgba(255,77,0,.14);backdrop-filter:blur(14px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,77,0,.3),0 6px 18px rgba(0,0,0,.3)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--o);box-shadow:0 0 10px var(--o)}
h1{font-size:52px;line-height:1.06;font-weight:800;letter-spacing:-.035em;margin:18px 0 12px;max-width:900px}
h1 .dot,.dot{color:var(--o)}
.lead{color:var(--mut);font-size:18px;line-height:1.5;max-width:760px;margin:0}

/* tarjetas de vidrio */
.glass-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.gcard{border-radius:22px;padding:18px 20px;background:rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.4),0 26px 60px rgba(0,0,0,.35)}
.gcard .l{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.gcard .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;color:#fff}
.gcard .s{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.gcard.hot{background:linear-gradient(160deg,rgba(255,98,32,.32),rgba(255,77,0,.12) 60%,rgba(255,77,0,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,77,0,.45),0 18px 50px rgba(255,77,0,.22)}
.up{color:var(--okl)}.down{color:var(--badl)}

/* pestañas tipo píldora */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
.tabs button{font:inherit;font-size:14px;font-weight:600;color:var(--cream);border:0;cursor:pointer;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.08)}
.tabs button:hover{background:rgba(255,255,255,.1)}
.tabs button.on{color:#000;background:linear-gradient(#FF6220,#FF4D00 46%,#F04400);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(255,77,0,.35)}

/* ---------- sección crema ---------- */
.cream{position:relative;overflow:hidden;padding:34px 28px 70px}
.cream::before{content:"";position:absolute;left:-10%;top:-10%;width:60%;height:60%;background:radial-gradient(closest-side,rgba(255,77,0,.10),transparent 70%);pointer-events:none}
.kicker{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--od)}
h2{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em;margin:8px 0 6px}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--g);font-size:14.5px;line-height:1.5;margin:0}
.grid{display:grid;gap:16px}
.two{grid-template-columns:1.7fr 1fr}.half{grid-template-columns:1fr 1fr}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(26,26,26,.04),0 12px 32px rgba(120,90,40,.10)}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.muted{color:var(--g)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.chartbox{position:relative;height:320px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--g);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:12px;border-bottom:1px solid #F1ECE2;vertical-align:top}
tr.click{transition:background .12s}tr.click:hover td{background:#FBF8F3;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--cream2);color:var(--ink)}
.chip.o{background:var(--ol);color:var(--od)}.chip.g{background:#E3F6EA;color:var(--ok)}.chip.r{background:#FDE7EA;color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--cream2);overflow:hidden}.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6220,#F04400)}
.dist-row{display:grid;grid-template-columns:120px 1fr 92px 92px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #F1ECE2}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:11px 16px;border-radius:12px;border:0;font:inherit;background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line)}
.toolbar input[type=search]:focus{outline:2px solid var(--o)}
label.tg{display:flex;gap:8px;align-items:center;color:var(--g);font-weight:600;font-size:14px}
.empty{padding:40px 20px;text-align:center;color:var(--g)}
.total{text-align:right}.total .l{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--g);text-transform:uppercase}.total .v{font-size:28px;font-weight:800;letter-spacing:-.03em}
.note{font-size:13px;color:var(--g);margin-top:10px}
.cfg-row{display:grid;grid-template-columns:240px 150px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #F1ECE2}
.cfg-row input{padding:9px 12px;border-radius:10px;border:0;font:inherit;background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line);width:100%}
.statement td{padding:11px 4px}

/* modal (vidrio oscuro) */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px;padding:26px;color:var(--cream);
  background:rgba(14,14,14,.86);backdrop-filter:blur(26px) saturate(1.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-size:22px;letter-spacing:-.02em;margin-bottom:16px;color:#fff}
.field{margin-bottom:13px}.field label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border-radius:12px;border:0;font:inherit;color:#fff;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color-scheme:dark}
.field select option{background:#111;color:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--o)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.actions .left{margin-right:auto}
#hint{color:#FFB28F}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:none;padding:12px 20px;border-radius:999px;color:var(--cream);font-weight:600;
  background:rgba(10,10,10,.85);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,77,0,.4),0 10px 30px rgba(0,0,0,.4)}
.loading{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);color:#fff;font-weight:700}
.loading.off{display:none}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:var(--o);animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:1000px){.glass-grid{grid-template-columns:repeat(2,1fr)}.two,.half{grid-template-columns:1fr}h1{font-size:36px}.cfg-row{grid-template-columns:1fr}}
@media(max-width:560px){.top{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;flex-wrap:wrap}.hero,.cream{padding-left:16px;padding-right:16px}.gcard .v{font-size:24px}.dist-row{grid-template-columns:90px 1fr 80px}.dist-row>div:last-child{display:none}}
</style>
</head>

async function mcp(tool,args){var r=await window.cowork.callMcpTool(T+tool,args);if(r.isError)throw new Error((r.content&&r.content[0]&&r.content[0].text)||'Error del conector');return r.structuredContent!=null?r.structuredContent:JSON.parse(r.content[0].text)}
function qn(n){return "'"+n+"'"}
function pnum(x){if(x===''||x==null)return '';var t=String(x),n=Number(t.replace(/[$,%\s]/g,''));if(isNaN(n))return x;return t.indexOf('%')>=0?n/100:n}
async function A_getData(){
  BUST++;var out={tables:{},config:{},configRows:[]},keys=Object.keys(SH);
  var res=await Promise.all(keys.map(function(k){var d=SH[k];return mcp('get_values',{spreadsheetId:SID,range:qn(d.name)+'!A2:'+LET[d.width-1]+(d.rows-(BUST%40))})}));
  keys.forEach(function(k,j){var d=SH[k],vals=res[j].values||[];RAW[k]=vals;var rows=[];
    vals.forEach(function(r,i){if(!r[0])return;var v=[];for(var c=0;c<d.width;c++){var x=r[c]==null?'':r[c];if(d.num.indexOf(c)>=0)x=pnum(x);v.push(x)}rows.push({row:i+2,v:v})});
    out.tables[k]={cols:COLS[k],rows:rows}});
  var cfg=await mcp('get_values',{spreadsheetId:SID,range:'Config!A2:C'+(50-(BUST%40))});
  (cfg.values||[]).forEach(function(r,i){if(!r[0])return;var val=pnum(r[1]);out.config[r[0]]=val;CFGROWS[r[0]]=i+2;out.configRows.push({row:i+2,key:r[0],value:val,desc:r[2]||''})});
  return out;
}
async function A_saveRow(key,row,vals){
  var d=SH[key],w=d.write||d.width;
  if(!row){var raw=RAW[key]||[],i=-1;for(var j=0;j<raw.length;j++){if(!raw[j]||!raw[j][0]){i=j;break}}row=i>=0?i+2:raw.length+2}
  var v=vals.slice(0,w).map(function(x,c){if(d.num.indexOf(c)>=0&&x!==''&&x!=null&&!isNaN(Number(x)))return Number(x);return x==null?'':x});
  await mcp('update_values',{spreadsheetId:SID,range:qn(d.name)+'!A'+row+':'+LET[w-1]+row,values:[v]});
  return A_getData();
}
async function A_deleteRow(key,row){
  await mcp('update_spreadsheet',{spreadsheetId:SID,requests:[{deleteDimension:{range:{sheetId:SH[key].id,dimension:'ROWS',startIndex:row-1,endIndex:row}}}]});
  return A_getData();
}
async function A_saveConfig(ch){
  for(var k in ch){if(CFGROWS[k])await mcp('update_values',{spreadsheetId:SID,range:'Config!B'+CFGROWS[k],values:[[ch[k]]]})}

}

function month(m){
  var ing=rows('ingresos').map(I).filter(function(x){return ymOf(x.fecha)===m});
  var ingresos=ing.reduce(function(a,x){return a+x.monto},0),comVend=ing.reduce(function(a,x){return a+x.com},0),comOv=ing.reduce(function(a,x){return a+x.ov},0);

  var fijosRows=rows('gastosFijos').filter(function(r){return r.v[3]==='Sí'&&(!r.v[4]||r.v[4]<=ld)&&(!r.v[5]||r.v[5]>=fd)});
  var fijos=fijosRows.reduce(function(a,r){return a+num(r.v[2])},0);
  var varRows=rows('gastos').filter(function(r){return ymOf(r.v[0])===m});
  var variables=varRows.reduce(function(a,r){return a+num(r.v[3])},0);
  var gastos=fijos+variables,comisiones=comVend+comOv,utilidad=ingresos-comisiones-gastos;

  var porTipo={};ing.forEach(function(x){var t=x.tipo||'Otro';porTipo[t]=(porTipo[t]||0)+x.monto});

}
function saldo(){var last={};rows('cuenta').forEach(function(r){var c=r.v[1]||'Cuenta';if(!last[c]||r.v[0]>=last[c].f)last[c]={f:r.v[0],s:num(r.v[2])}});
  var tot=0,f='';Object.keys(last).forEach(function(c){tot+=last[c].s;if(last[c].f>f)f=last[c].f});return{total:tot,fecha:f,has:Object.keys(last).length>0}}
function lastBill(c){var l=null;rows('ingresos').map(I).forEach(function(x){if(x.cliente===c&&x.tipo==='Mensualidad'&&(!l||x.fecha>=l.fecha))l=x});return l?l.monto:0}
function clientesInfo(){var cl=rows('clientes'),act=cl.filter(function(r){return r.v[3]==='Activo'});var mrr=act.reduce(function(a,r){return a+(r.v[1]==='Por mensaje'?lastBill(r.v[0]):num(r.v[6]))},0);
  var pagos={};rows('ingresos').map(I).forEach(function(x){if(x.tipo==='Mensualidad')pagos[x.cliente]=Math.max(pagos[x.cliente]||0,num(x.mes))});
  var calif=act.filter(function(r){return(r.v[5]==='Socio comercial'||r.v[5]==='Vendedor')&&(pagos[r.v[0]]||0)>=3}).length;
  return{total:cl.length,activos:act.length,prueba:cl.filter(function(r){return r.v[3]==='Prueba'}).length,mrr:mrr,calif:calif}}

  h+='</div><div class="card"><div class="kicker">Participación</div><h2>Socio comercial</h2><p class="sub">'+C.calif+' de '+t2+' clientes</p><div class="bar" style="margin:12px 0 6px"><div style="width:'+Math.min(100,C.calif/t2*100)+'%"></div></div>'+
    '<table><tr><td>'+t1+' clientes activos</td><td class="num">'+pct(num(CFG.meta_tramo1_pct))+'</td><td class="num">'+(C.calif>=t1?'<span class="chip g">Alcanzado</span>':'<span class="chip">Faltan '+(t1-C.calif)+'</span>')+'</td></tr>'+
    '<tr><td>'+t2+' clientes activos</td><td class="num">'+pct(num(CFG.meta_tramo2_pct))+'</td><td class="num">'+(C.calif>=t2?'<span class="chip g">Alcanzado</span>':'<span class="chip">Faltan '+(t2-C.calif)+'</span>')+'</td></tr></table>'+
    '<div class="note">Participación ganada hoy: <b>'+pct(pp)+'</b>. Se entrega después de 12 meses.</div></div></div>';
  var lines=M.ing.filter(function(x){return x.com>0||x.ov>0});
  h+='<div class="card" style="margin-top:16px"><div class="kicker">Detalle</div><h2>Pagos que generan comisión</h2>';
  if(!lines.length)h+='<div class="empty">Sin pagos con comisión este mes</div>';
  else{h+='<div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th class="num">Monto</th><th>Vendido por</th><th class="num">Comisión</th><th class="num">Override</th></tr>';
    lines.sort(function(a,b){return a.fecha<b.fecha?1:-1}).forEach(function(x){h+='<tr><td>'+esc(x.fecha)+'</td><td><b>'+esc(x.cliente)+'</b></td><td>'+esc(x.tipo)+(x.mes?' <span class="muted">#'+x.mes+'</span>':'')+'</td><td class="num">'+$m(x.monto)+'</td><td>'+esc(x.vendedor)+'</td><td class="num">'+$m(x.com)+'</td><td class="num">'+$m(x.ov)+'</td></tr>'});h+='</table></div>'}
  document.getElementById('view').innerHTML=h+'</div>';
}

/* ============ Tablas editables ============ */
var CATS=['Créditos de IA','Infraestructura','Software','Marketing','Legal y contable','Comisiones bancarias','Viáticos','Otro'];
function clientNames(){return rows('clientes').map(function(r){return r.v[0]})}
function sellerNames(){var s={Gabriel:1,Daniel:1};rows('clientes').forEach(function(r){if(r.v[4])s[r.v[4]]=1});if(CFG.socio_comercial_nombre)s[CFG.socio_comercial_nombre]=1;return Object.keys(s)}
function accountNames(){var s={};rows('cuenta').forEach(function(r){if(r.v[1])s[r.v[1]]=1});return Object.keys(s)}
var DEF={
  ingresos:{eb:'Lo que entra',title:'Ingresos',sub:'Cada pago que entra: mensualidades, instalaciones u otros. Las comisiones se calculan solas.',dateIdx:0,amountIdx:3,
    fields:[{l:'Fecha',t:'date'},{l:'Cliente',t:'list',src:clientNames},{l:'Tipo',t:'select',o:['Mensualidad','Instalación','Otro']},{l:'Monto (USD)',t:'number'},{l:'Notas',t:'text'}],show:[0,1,2,3,6,8,9],extra:{5:'Mes #',6:'Vendido por',7:'Rol',8:'Comisión',9:'Override'},money:[3,8,9]},
  gastos:{eb:'Lo que sale',title:'Gastos variables',sub:'Créditos de IA, compras puntuales y todo lo que no se paga cada mes.',dateIdx:0,amountIdx:3,
    fields:[{l:'Fecha',t:'date'},{l:'Concepto',t:'text'},{l:'Categoría',t:'list',src:function(){return CATS}},{l:'Monto (USD)',t:'number'},{l:'Notas',t:'text'}],money:[3]},
  gastosFijos:{eb:'Todos los meses',title:'Gastos fijos',sub:'Se cuentan solos en cada mes mientras estén activos.',amountIdx:2,
    fields:[{l:'Concepto',t:'text'},{l:'Categoría',t:'list',src:function(){return CATS}},{l:'Monto mensual (USD)',t:'number'},{l:'Activo',t:'select',o:['Sí','No']},{l:'Desde',t:'date'},{l:'Hasta (opcional)',t:'date'},{l:'Notas',t:'text'}],money:[2]},
  clientes:{eb:'Cartera',title:'Clientes',sub:'Plan, estado y quién lo vendió. De esto dependen las comisiones.',
    fields:[{l:'Cliente',t:'text'},{l:'Plan',t:'select',o:['Lite','Starter','Growth','Por mensaje','Personalizado']},{l:'Fecha inicio',t:'date'},{l:'Estado',t:'select',o:['Prueba','Activo','Pausado','Cancelado']},{l:'Vendido por',t:'list',src:sellerNames},{l:'Rol del vendedor',t:'select',o:['Fundador','Socio comercial','Vendedor']},{l:'Mensualidad (USD) · vacío si paga por mensaje',t:'number'},{l:'Notas',t:'text'}],money:[6]},
  cuenta:{eb:'Banco',title:'Saldo en cuenta',sub:'Anotá el saldo cada vez que revisen el banco. Se usa el último registro de cada cuenta.',dateIdx:0,
    fields:[{l:'Fecha',t:'date'},{l:'Cuenta',t:'list',src:accountNames},{l:'Saldo (USD)',t:'number'},{l:'Notas',t:'text'}],money:[2]},
  distribucion:{eb:'Reparto',title:'Distribución registrada',sub:'Lo que efectivamente se movió a reinversión, reserva, Gabriel, Daniel o comisiones.',dateIdx:0,amountIdx:3,monthIdx:1,
    fields:[{l:'Fecha',t:'date'},{l:'Mes al que corresponde',t:'date'},{l:'Destino',t:'select',o:['Reinversión','Reserva','Gabriel','Daniel','Comisiones']},{l:'Monto (USD)',t:'number'},{l:'Notas',t:'text'}],money:[3]}
};
var tableState={};
function renderTable(key){
  var def=DEF[key],st=tableState[key]=tableState[key]||{q:'',onlyMonth:def.dateIdx!==undefined||def.monthIdx!==undefined,sort:null,dir:-1};
  var cols=D.tables[key].cols,show=def.show||cols.map(function(_,i){return i}),data=rows(key).slice();
  if(st.onlyMonth){var mi=def.monthIdx!==undefined?def.monthIdx:def.dateIdx;if(mi!==undefined)data=data.filter(function(r){return ymOf(r.v[mi])===SEL})}
  if(st.q){var q=st.q.toLowerCase();data=data.filter(function(r){return r.v.join(' ').toLowerCase().indexOf(q)>=0})}
  var si=st.sort!==null?st.sort:(def.dateIdx!==undefined?def.dateIdx:null);
  if(si!==null)data.sort(function(a,b){var x=a.v[si],y=b.v[si];if(typeof x==='number'||typeof y==='number'){x=num(x);y=num(y)}return(x>y?1:x<y?-1:0)*st.dir});
  var total=def.amountIdx!==undefined?data.reduce(function(a,r){return a+(key==='gastosFijos'&&r.v[3]!=='Sí'?0:num(r.v[def.amountIdx]))},0):null;
  var hasM=def.dateIdx!==undefined||def.monthIdx!==undefined;
  setHero(def.eb+(hasM&&st.onlyMonth?' · '+mName(SEL):''),def.title+'<span class="dot">.</span>',def.sub,
    '<div class="glass-grid">'+(total!==null?g(key==='gastosFijos'?'Total mensual activo':'Total',$m(total),data.length+' registro'+(data.length===1?'':'s'),'hot'):g('Registros',data.length,hasM&&st.onlyMonth?mName(SEL):'En total','hot'))+'</div>');
  var h='<div class="card"><div class="toolbar"><input type="search" id="tq" placeholder="Buscar…" value="'+esc(st.q)+'">'+
    (hasM?'<label class="tg"><input type="checkbox" id="tm" '+(st.onlyMonth?'checked':'')+'> Solo '+mName(SEL)+'</label>':'')+'<button class="btn" id="addBtn">+ Agregar</button></div>';
  if(!data.length)h+='<div class="empty">No hay registros'+(st.onlyMonth?' en '+mName(SEL):'')+'. Usá “+ Agregar”.</div>';
  else{h+='<div style="overflow-x:auto"><table><tr>'+show.map(function(i){var nm=cols[i]||def.extra[i],isM=(def.money||[]).indexOf(i)>=0;return '<th data-i="'+i+'" class="'+(isM?'num':'')+'">'+esc(nm)+(si===i?(st.dir>0?' ↑':' ↓'):'')+'</th>'}).join('')+'</tr>';
    data.forEach(function(r){h+='<tr class="click" data-row="'+r.row+'">'+show.map(function(i,ix){var val=r.v[i],isM=(def.money||[]).indexOf(i)>=0;
      if(isM)return '<td class="num">'+(val===''?'':$m(val))+'</td>';
      if(key==='clientes'&&i===3)return '<td><span class="chip '+({Activo:'g',Prueba:'o',Cancelado:'r'}[val]||'')+'">'+esc(val)+'</span></td>';
      if(key==='gastosFijos'&&i===3)return '<td><span class="chip '+(val==='Sí'?'g':'')+'">'+esc(val)+'</span></td>';
      if(key==='distribucion'&&i===1)return '<td>'+esc(val?mName(ymOf(val),true):'')+'</td>';
      return '<td>'+(ix===0||(key==='ingresos'&&i===1)?'<b>'+esc(val)+'</b>':esc(val))+'</td>'}).join('')+'</tr>'});h+='</table></div>'}
  var v=document.getElementById('view');v.innerHTML=h+'</div>';
  var tq=document.getElementById('tq');tq.oninput=function(){st.q=tq.value;var p=tq.selectionStart;renderTable(key);var n=document.getElementById('tq');n.focus();n.setSelectionRange(p,p)};
  var tm=document.getElementById('tm');if(tm)tm.onchange=function(){st.onlyMonth=tm.checked;renderTable(key)};
  document.getElementById('addBtn').onclick=function(){openForm(key,null)};
  v.querySelectorAll('th[data-i]').forEach(function(th){th.onclick=function(){var i=Number(th.dataset.i);if(st.sort===i)st.dir*=-1;else{st.sort=i;st.dir=-1}renderTable(key)}});
  v.querySelectorAll('tr[data-row]').forEach(function(tr){tr.onclick=function(){openForm(key,Number(tr.dataset.row))}});
}

/* ============ Formulario ============ */
function defaults(key){var t=today();
  if(key==='ingresos')return[t,'','Mensualidad','',''];if(key==='gastos')return[t,'','Créditos de IA','',''];
  if(key==='gastosFijos')return['','Infraestructura','','Sí',firstDay(SEL),'',''];
  if(key==='clientes')return['','Starter',t,'Prueba','Gabriel','Fundador',num(CFG.precio_starter)||'',''];
  if(key==='cuenta'){var a=accountNames();return[t,a[0]||'Cuenta principal','',''];}
  if(key==='distribucion')return[t,firstDay(SEL),'Reinversión','',''];return[]}
function planPrice(plan,kind){return num(CFG[(kind==='inst'?'instalacion_':'precio_')+(plan||'').toLowerCase()])}
function openForm(key,row){
  var def=DEF[key],rec=row?rows(key).filter(function(r){return r.row===row})[0]:null,vals=rec?rec.v.slice(0,def.fields.length):defaults(key);
  var h='<h3>'+(rec?'Editar':'Agregar')+' · '+def.title+'</h3><form id="frm">';
  def.fields.forEach(function(f,i){var val=vals[i]==null?'':vals[i];h+='<div class="field"><label>'+f.l+'</label>';
    if(f.t==='select')h+='<select name="f'+i+'">'+f.o.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
    else if(f.t==='list'){h+='<input name="f'+i+'" list="dl'+i+'" value="'+esc(val)+'" autocomplete="off"><datalist id="dl'+i+'">'+f.src().map(function(o){return '<option value="'+esc(o)+'">'}).join('')+'</datalist>'}
    else h+='<input name="f'+i+'" type="'+(f.t==='number'?'number':f.t)+'" '+(f.t==='number'?'step="0.01"':'')+' value="'+esc(val)+'">';h+='</div>'});
  if(key==='ingresos')h+='<div class="field" id="msgBox" style="display:none"><label>Mensajes enviados en el mes</label><input id="msgs" type="number" min="0" step="1" placeholder="Ej. 461"></div><div class="note" id="hint"></div>';
  h+='<div class="actions">'+(rec?'<button type="button" class="btn danger sm left" id="del">Eliminar</button>':'')+'<button type="button" class="btn glass" id="cancel">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>';
  document.getElementById('modal').innerHTML=h;document.getElementById('mbg').classList.add('on');var F=document.getElementById('frm');
  if(key==='clientes'){F.f1.onchange=function(){if(F.f1.value==='Por mensaje'){F.f6.value='';return}var p=planPrice(F.f1.value);if(p)F.f6.value=p};
    F.f4.oninput=function(){var n=F.f4.value;if(n==='Gabriel'||n==='Daniel')F.f5.value='Fundador';else if(CFG.socio_comercial_nombre&&n===CFG.socio_comercial_nombre)F.f5.value='Socio comercial'}}
  if(key==='ingresos'){var fill=function(){var c=rows('clientes').filter(function(r){return r.v[0]===F.f1.value})[0],hint=document.getElementById('hint');
      if(!c){hint.textContent=F.f1.value?'Este cliente no está en Clientes; no se van a calcular comisiones.':'';return}
      var pm=c.v[1]==='Por mensaje'&&F.f2.value==='Mensualidad',tar=num(CFG.precio_por_mensaje)||0.15;
      document.getElementById('msgBox').style.display=pm?'block':'none';
      hint.textContent='Plan '+c.v[1]+(pm?' ($'+tar+' por mensaje)':'')+' · vendido por '+(c.v[4]||'—')+' ('+(c.v[5]||'sin rol')+')';
      if(pm)return;
      if(!F.f3.value||F.f3.dataset.auto){var amt=F.f2.value==='Mensualidad'?num(c.v[6]):(F.f2.value==='Instalación'?planPrice(c.v[1],'inst'):0);if(amt){F.f3.value=amt;F.f3.dataset.auto=1}}};
    F.f1.oninput=fill;F.f2.onchange=function(){if(F.f3.dataset.auto)F.f3.value='';fill()};F.f3.oninput=function(){F.f3.dataset.auto=''};
    var M=document.getElementById('msgs');var nm=String(F.f4.value||'').match(/^(\d+) mensajes/);if(nm)M.value=nm[1];
    M.oninput=function(){var tar=num(CFG.precio_por_mensaje)||0.15,n=Math.max(0,Math.round(num(M.value)));F.f3.value=Math.round(n*tar*100)/100;F.f4.value=n?n+' mensajes × $'+tar:''};fill()}
  document.getElementById('cancel').onclick=closeForm;
  if(rec)document.getElementById('del').onclick=function(){if(!confirm('¿Eliminar este registro del Sheet?'))return;busy(true);call('deleteRow',key,row).then(function(d){setData(d);closeForm();toast('Eliminado')}).catch(err).finally(function(){busy(false)})};
  F.onsubmit=function(e){e.preventDefault();var out=def.fields.map(function(f,i){return F['f'+i].value});if(!out[0]){toast('Completá el primer campo');return}
    busy(true);call('saveRow',key,row,out).then(function(d){setData(d);closeForm();toast('Guardado en el Sheet')}).catch(err).finally(function(){busy(false)})};
}
function closeForm(){document.getElementById('mbg').classList.remove('on')}
document.getElementById('mbg').addEventListener('click',function(e){if(e.target.id==='mbg')closeForm()});

/* ============ Configuración ============ */
function renderConfig(){
  setHero('Ajustes','Configuración<span class="dot">.</span>','Precios, comisiones y reparto de la utilidad. Los porcentajes van como decimal: 0.4 es 40%.','');
  var h='<div class="card">';D.configRows.forEach(function(c){h+='<div class="cfg-row"><b>'+esc(c.key)+'</b><input data-k="'+esc(c.key)+'" value="'+esc(c.value)+'"><span class="muted">'+esc(c.desc)+'</span></div>'});
  h+='<div class="actions"><button class="btn" id="saveCfg">Guardar cambios</button></div></div>';var v=document.getElementById('view');v.innerHTML=h;
  document.getElementById('saveCfg').onclick=function(){var ch={};v.querySelectorAll('input[data-k]').forEach(function(i){var k=i.dataset.k,val=i.value;if(String(CFG[k])!==val)ch[k]=(val!==''&&!isNaN(Number(val)))?Number(val):val});
    if(!Object.keys(ch).length){toast('No hay cambios');return}busy(true);call('saveConfig',ch).then(function(d){setData(d);toast('Configuración guardada')}).catch(err).finally(function(){busy(false)})};
}

/* ============ Carga ============ */
function err(e){busy(false);alert('Error: '+(e&&e.message||e))}
function setData(d){D=d;CFG=d.config||{};render()}
function load(){busy(true);call('getData').then(setData).catch(err).finally(function(){busy(false)})}
load();
</script>
</body>
