<style>
.login{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:#000;
  background-image:radial-gradient(closest-side at 75% 20%,rgba(255,77,0,.3),rgba(255,77,0,.06) 60%,transparent 80%)}
.login.on{display:flex}
.login-card{width:100%;max-width:380px;border-radius:24px;padding:32px 26px;text-align:center;color:var(--cream);background:rgba(255,255,255,.06);
  backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08),0 26px 60px rgba(0,0,0,.5)}
.login-card .logo{height:24px;margin:0 auto}
.login-card h1{font-size:40px;margin:16px 0 8px;color:#fff}
.login-card p{color:var(--mut);line-height:1.5;margin:0 0 22px}
#gbtn{display:flex;justify-content:center;min-height:44px}
</style>
