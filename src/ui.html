<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abita · Finanzas</title>
<!--CHARTJS-->
<style>
:root{color-scheme:light;
  --o:#FF4D00;--o2:#FF6220;--o3:#F04400;--od:#B33500;--ol:#FFE5DB;
  --k:#000;--ink:#1A1A1A;--cream:#EBE4D6;--cream2:#F4EFE6;--mut:#B8B0A3;--g:#6F6F6F;--line:#E1D9C9;
  --ok:#1F9D55;--okl:#4ADE80;--bad:#D7263D;--badl:#FF6B7A;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);font-family:var(--f);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
svg.logo{height:20px;width:auto;color:var(--cream);display:block}

/* ---------- barra superior (vidrio oscuro) ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 28px;
  background:rgba(8,8,8,.88);backdrop-filter:blur(26px) saturate(1.9);-webkit-backdrop-filter:blur(26px) saturate(1.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 34px rgba(0,0,0,.42);border-bottom:1px solid rgba(255,255,255,.06)}
.top .tag{color:var(--mut);font-weight:600;font-size:14px;padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}
.top{padding-top:calc(14px + env(safe-area-inset-top));padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
.top .sp{flex:1}
.month{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07)}
.month button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--cream);font-size:18px;cursor:pointer}
.month button:hover{background:rgba(255,255,255,.1)}
.month span{min-width:140px;text-align:center;font-weight:700;color:var(--cream);font-size:14px}

/* ---------- botones ---------- */
.btn{font:inherit;font-weight:600;font-size:15px;letter-spacing:-.01em;border-radius:12px;padding:11px 18px;cursor:pointer;border:1px solid transparent;color:#000;
  background:linear-gradient(#FF6220 0%,#FF4D00 46%,#F04400 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 3px rgba(255,77,0,.24),0 6px 16px rgba(255,77,0,.26),0 18px 40px rgba(255,77,0,.18);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.glass{color:var(--cream);background:rgba(255,255,255,.055);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.36)}
.btn.light{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.05)}
.btn.danger{color:#fff;background:var(--bad);box-shadow:0 6px 16px rgba(215,38,61,.25)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}

/* ---------- hero oscuro ---------- */
.hero{position:relative;overflow:hidden;background:#000;color:var(--cream);padding:46px 28px 30px}
.hero::before{content:"";position:absolute;right:-12%;top:-30%;width:70%;height:150%;
  background:radial-gradient(closest-side,rgba(255,77,0,.28),rgba(255,77,0,.08) 55%,transparent 75%);pointer-events:none}
.hero .mark{position:absolute;right:-60px;bottom:-80px;width:620px;color:#FF4D00;opacity:.07;pointer-events:none}
.wrap{max-width:1280px;margin:0 auto;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#FFB28F;
  padding:7px 14px;border-radius:999px;background:rgba(255,77,0,.14);backdrop-filter:blur(14px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,77,0,.3),0 6px 18px rgba(0,0,0,.3)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--o);box-shadow:0 0 10px var(--o)}
h1{font-size:52px;line-height:1.06;font-weight:800;letter-spacing:-.035em;margin:18px 0 12px;max-width:900px}
h1 .dot,.dot{color:var(--o)}
.lead{color:var(--mut);font-size:18px;line-height:1.5;max-width:760px;margin:0}

/* tarjetas de vidrio */
.glass-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.gcard{border-radius:22px;padding:18px 20px;background:rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.4),0 26px 60px rgba(0,0,0,.35)}
.gcard .l{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.gcard .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;color:#fff}
.gcard .s{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.gcard.hot{background:linear-gradient(160deg,rgba(255,98,32,.32),rgba(255,77,0,.12) 60%,rgba(255,77,0,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,77,0,.45),0 18px 50px rgba(255,77,0,.22)}
.up{color:var(--okl)}.down{color:var(--badl)}

/* pestañas tipo píldora */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
.tabs button{font:inherit;font-size:14px;font-weight:600;color:var(--cream);border:0;cursor:pointer;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.08)}
.tabs button:hover{background:rgba(255,255,255,.1)}
.tabs button.on{color:#000;background:linear-gradient(#FF6220,#FF4D00 46%,#F04400);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(255,77,0,.35)}

/* ---------- sección crema ---------- */
.cream{position:relative;overflow:hidden;padding:34px 28px 70px}
.cream::before{content:"";position:absolute;left:-10%;top:-10%;width:60%;height:60%;background:radial-gradient(closest-side,rgba(255,77,0,.10),transparent 70%);pointer-events:none}
.kicker{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--od)}
h2{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em;margin:8px 0 6px}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--g);font-size:14.5px;line-height:1.5;margin:0}
.grid{display:grid;gap:16px}
.two{grid-template-columns:1.7fr 1fr}.half{grid-template-columns:1fr 1fr}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(26,26,26,.04),0 12px 32px rgba(120,90,40,.10)}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.muted{color:var(--g)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.chartbox{position:relative;height:320px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--g);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:12px;border-bottom:1px solid #F1ECE2;vertical-align:top}
tr.click{transition:background .12s}tr.click:hover td{background:#FBF8F3;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--cream2);color:var(--ink)}
.chip.o{background:var(--ol);color:var(--od)}.chip.g{background:#E3F6EA;color:var(--ok)}.chip.r{background:#FDE7EA;color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--cream2);overflow:hidden}.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6220,#F04400)}
.dist-row{display:grid;grid-template-columns:120px 1fr 92px 92px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #F1ECE2}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:11px 16px;border-radius:12px;border:0;font:inherit;background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line)}
.toolbar input[type=search]:focus{outline:2px solid var(--o)}
label.tg{display:flex;gap:8px;align-items:center;color:var(--g);font-weight:600;font-size:14px}
.empty{padding:40px 20px;text-align:center;color:var(--g)}
.total{text-align:right}.total .l{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--g);text-transform:uppercase}.total .v{font-size:28px;font-weight:800;letter-spacing:-.03em}
.note{font-size:13px;color:var(--g);margin-top:10px}
.cfg-row{display:grid;grid-template-columns:240px 150px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #F1ECE2}
.cfg-list{display:grid;grid-template-columns:240px 1fr;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid #F1ECE2}
.cfg-list .muted{grid-column:2;font-size:13px}
.cfg-row input,.cfg-list input{padding:9px 12px;border-radius:10px;border:0;font:inherit;background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line);width:100%}
.statement td{padding:11px 4px}

/* modal (vidrio oscuro) */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px;padding:26px;color:var(--cream);
  background:rgba(14,14,14,.86);backdrop-filter:blur(26px) saturate(1.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-size:22px;letter-spacing:-.02em;margin-bottom:16px;color:#fff}
.field{margin-bottom:13px}.field label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border-radius:12px;border:0;font:inherit;color:#fff;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color-scheme:dark}
.field select option{background:#111;color:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--o)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.actions .left{margin-right:auto}
#hint{color:#FFB28F}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:none;padding:12px 20px;border-radius:999px;color:var(--cream);font-weight:600;
  background:rgba(10,10,10,.85);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,77,0,.4),0 10px 30px rgba(0,0,0,.4)}
.loading{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);color:#fff;font-weight:700}
.loading.off{display:none}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:var(--o);animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- gastos fijos del mes ---------- */
.fx-item{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid #F1ECE2;cursor:pointer;border-radius:10px;transition:background .12s}
.fx-item:hover{background:#FBF8F3}
.fx-main{flex:1;min-width:0}.fx-main b{display:block;font-size:15.5px}.fx-main .muted{font-size:13px}
.fx-amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.fx-item.off{opacity:.55}
.fx-item .chip.g{cursor:pointer}
.fx-sec{margin:22px 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
@media(max-width:560px){.fx-item{flex-wrap:wrap;gap:6px 12px}.fx-item .fx-act{width:100%;display:flex;justify-content:flex-end}}

/* ---------- selector de período ---------- */
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08)}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-size:13.5px;font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer;transition:color .15s}
.seg button:hover{color:var(--cream)}
.seg button.on{color:#000;background:linear-gradient(#FF6220,#FF4D00 46%,#F04400);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(255,77,0,.35)}
.month button.hide{visibility:hidden}

/* ---------- íconos, navegación del celular y hoja "Más" ---------- */
.ib{display:inline-flex;align-items:center;gap:7px}.ib svg{width:16px;height:16px;flex:none}
.bnav{display:none}
.sheet-bg{position:fixed;inset:0;z-index:55;display:none;align-items:flex-end;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet-bg.on{display:flex}
.sheet{width:100%;color:var(--cream);border-radius:24px 24px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));background:rgba(14,14,14,.96);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -20px 60px rgba(0,0,0,.4);animation:up .22s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.22);margin:6px auto 10px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:inherit;font:inherit;font-weight:700;font-size:16px;padding:13px 12px;border-radius:14px;text-align:left;cursor:pointer}
.sheet button svg{width:22px;height:22px;flex:none;color:var(--mut)}
.sheet button small{display:block;color:var(--mut);font-weight:500;font-size:12.5px;margin-top:2px}
.sheet button.on{background:rgba(255,77,0,.14)}.sheet button.on svg{color:var(--o)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}

/* ---------- Configuración ---------- */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cfg-card h3{font-size:22px;letter-spacing:-.02em;margin:6px 0 4px}
.cfg-card>.sub{margin-bottom:18px}
.span2{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld>span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.fld small{color:var(--g);font-size:12.5px;line-height:1.4}
.inp{display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:12px;background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s,background .15s}
.inp:focus-within{background:#fff;box-shadow:inset 0 0 0 2px var(--o)}
.inp.changed{background:#FFF6F0;box-shadow:inset 0 0 0 2px #FFB28F}
.inp input{flex:1;width:100%;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:11px 0;outline:none;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:#B8B0A3;font-weight:500}
.inp i{font-style:normal;color:var(--g);font-weight:600;font-size:14px;flex:none}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp input[type=number]{-moz-appearance:textfield}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}
.plan-row{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;align-items:center;padding:6px 0}
.plan-row.head{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g);padding:0 0 2px}
.split{display:flex;gap:3px;height:12px;margin-bottom:18px}
.split>div{height:100%;border-radius:99px;transition:width .25s;min-width:3px}
.split .rest{background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line)}
.tier{padding:14px 0 0;margin-top:14px;border-top:1px solid #F1ECE2}.tier:first-of-type{border-top:0;margin-top:0;padding-top:0}
.tier-n{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--od);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip-x{display:inline-flex;align-items:center;gap:6px;padding:5px 5px 5px 13px;border-radius:999px;background:var(--cream2);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;max-width:100%}
.chip-x>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-x button{display:grid;place-items:center;flex:none;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:rgba(26,26,26,.07);color:var(--g);font-size:16px;line-height:1;cursor:pointer}
.chip-x button:hover{background:var(--bad);color:#fff}
.chip-x.lock{padding-right:12px;background:#fff}.chip-x.lock svg{width:13px;height:13px;color:#B8B0A3}
.chip-add{display:inline-flex;align-items:center;gap:4px;padding:2px 3px 2px 13px;border:1.5px dashed #CFC6B6;border-radius:999px;transition:border-color .15s,background .15s}
.chip-add:focus-within{border-style:solid;border-color:var(--o);background:#fff}
.chip-add input{width:150px;border:0;background:transparent;font:inherit;font-size:14px;outline:none;padding:5px 0}
.chip-add button{width:28px;height:28px;flex:none;border:0;border-radius:50%;background:linear-gradient(#FF6220,#F04400);color:#000;font-size:18px;font-weight:700;line-height:1;cursor:pointer}
.lrow{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start;padding:16px 0;border-top:1px solid #F1ECE2}
.lrow>div:first-child b{display:block;padding-top:6px}.lrow small{display:block;color:var(--g);font-size:12.5px;line-height:1.4;margin-top:4px}
.savebar{position:fixed;left:50%;bottom:22px;z-index:46;display:flex;align-items:center;gap:10px;padding:7px 7px 7px 16px;border-radius:999px;white-space:nowrap;
  color:var(--cream);font-weight:600;font-size:14px;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 0 0 1px rgba(255,77,0,.35),0 14px 40px rgba(0,0,0,.35);transform:translate(-50%,40px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.2,.9,.3,1.15),opacity .2s,visibility .2s}
.savebar.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.savebar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 10px var(--o)}

@media(max-width:1000px){.cfg-grid{grid-template-columns:1fr}.lrow{grid-template-columns:1fr;gap:8px}.lrow>div:first-child b{padding:0}}
@media(max-width:700px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .tabs{display:none}
  .top{flex-wrap:nowrap;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  .top .tag,.top .lbl{display:none}.top .ib{padding:9px;border-radius:12px}
  svg.logo{height:16px}
  .month span{min-width:0;font-size:13px;white-space:nowrap}.month button{width:28px;height:28px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:rgba(8,8,8,.92);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-top:1px solid rgba(255,255,255,.07)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
  .bnav svg{width:22px;height:22px}.bnav button.on{color:var(--o)}
  .cream{padding-bottom:110px}
  .toolbar input[type=search]{min-width:0}
  #addBtn{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:44;border-radius:999px;padding:14px 20px}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-width:none;max-height:90vh;border-radius:24px 24px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr:first-child{display:none}

<script>
/*ADAPTER*/

/* ============ Estado y utilidades ============ */
var D=null,CFG={},VIEW='resumen',charts={};var SEL=ym(new Date());
/* Período: 'mes' (SEL), 'anio' (el año de SEL) o 'todo' (desde el primer movimiento). */
var PER='mes';try{PER=localStorage.getItem('abita_periodo')||'mes'}catch(e){}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ymOf(s){return (s||'').slice(0,7)}
function addM(m,n){var p=m.split('-').map(Number);return ym(new Date(p[0],p[1]-1+n,1))}
function mName(m,short){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('es',{month:short?'short':'long',year:'numeric'})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function firstDay(m){return m+'-01'}
function lastDay(m){var p=m.split('-').map(Number);return m+'-'+String(new Date(p[0],p[1],0).getDate()).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
function $m(n){return money.format(Number(n)||0)}
function pct(n){return isFinite(n)?(Math.round(n*1000)/10)+'%':'—'}
function num(v){var n=Number(v);return isFinite(n)?n:0}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rows(k){return (D&&D.tables[k])?D.tables[k].rows:[]}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},2600)}
function busy(on){document.getElementById('loading').classList.toggle('off',!on)}

/* ============ Cálculos ============ */
function I(r){return{row:r.row,fecha:r.v[0],cliente:r.v[1],tipo:r.v[2],monto:num(r.v[3]),notas:r.v[4],mes:r.v[5],vendedor:r.v[6],rol:r.v[7],com:num(r.v[8]),ov:num(r.v[9])}}
function month(m){
  var ing=rows('ingresos').map(I).filter(function(x){return ymOf(x.fecha)===m});
  var ingresos=ing.reduce(function(a,x){return a+x.monto},0),comVend=ing.reduce(function(a,x){return a+x.com},0),comOv=ing.reduce(function(a,x){return a+x.ov},0);
  // Gastos = lo que se pagó (pestaña Gastos). Los pagos de gastos fijos llevan "Gasto fijo" en Notas.
  var gRows=rows('gastos').filter(function(r){return ymOf(r.v[0])===m});
  var fijosRows=gRows.filter(esPagoFijo),varRows=gRows.filter(function(r){return !esPagoFijo(r)});
  var fijos=fijosRows.reduce(function(a,r){return a+num(r.v[3])},0);
  var variables=varRows.reduce(function(a,r){return a+num(r.v[3])},0);
  var gastos=fijos+variables,comisiones=comVend+comOv,utilidad=ingresos-comisiones-gastos;
  var cats={};gRows.forEach(function(r){var c=r.v[2]||'Sin categoría';cats[c]=(cats[c]||0)+num(r.v[3])});
  var porTipo={};ing.forEach(function(x){var t=x.tipo||'Otro';porTipo[t]=(porTipo[t]||0)+x.monto});
  return{m:m,ing:ing,ingresos:ingresos,comVend:comVend,comOv:comOv,comisiones:comisiones,fijos:fijos,variables:variables,gastos:gastos,utilidad:utilidad,margen:ingresos?utilidad/ingresos:NaN,cats:cats,porTipo:porTipo};
}
var FIJO_TAG='Gasto fijo';
function esPagoFijo(r){return String(r.v[4]||'').indexOf(FIJO_TAG)===0}
function vigenteEn(v,m){return v[3]==='Sí'&&(!v[4]||ymOf(v[4])<=m)&&(!v[5]||ymOf(v[5])>=m)}
/* Lo que se espera pagar de gastos fijos en el mes m (para el punto de equilibrio y "falta pagar"). */
/* Gastos fijos vigentes en m que no tienen un pago anotado ese mes (mismo concepto, Notas "Gasto fijo"). */
function fijosPendientes(m){var pag={};rows('gastos').forEach(function(r){if(ymOf(r.v[0])===m&&esPagoFijo(r))pag[r.v[1]]=1});
  return rows('gastosFijos').filter(function(r){return vigenteEn(r.v,m)&&!pag[r.v[0]]})}
function fijosEsperados(m){return rows('gastosFijos').filter(function(r){return vigenteEn(r.v,m)}).reduce(function(a,r){return a+num(r.v[2])},0)}
function saldo(){var last={};rows('cuenta').forEach(function(r){var c=r.v[1]||'Cuenta';if(!last[c]||r.v[0]>=last[c].f)last[c]={f:r.v[0],s:num(r.v[2])}});
  var tot=0,f='';Object.keys(last).forEach(function(c){tot+=last[c].s;if(last[c].f>f)f=last[c].f});return{total:tot,fecha:f,has:Object.keys(last).length>0}}
function lastBill(c){var l=null;rows('ingresos').map(I).forEach(function(x){if(x.cliente===c&&x.tipo==='Mensualidad'&&(!l||x.fecha>=l.fecha))l=x});return l?l.monto:0}
// Recurrente = suscripciones activas (mensualidad fija). Los planes "Por mensaje" van aparte como ingreso por uso (su último pago).
function clientesInfo(){var cl=rows('clientes'),act=cl.filter(function(r){return r.v[3]==='Activo'}),porUso=function(r){return r.v[1]==='Por mensaje'};
  var mrr=act.filter(function(r){return !porUso(r)}).reduce(function(a,r){return a+num(r.v[6])},0),uso=act.filter(porUso).reduce(function(a,r){return a+lastBill(r.v[0])},0),nUso=act.filter(porUso).length;
  var pagos={};rows('ingresos').map(I).forEach(function(x){if(x.tipo==='Mensualidad')pagos[x.cliente]=Math.max(pagos[x.cliente]||0,num(x.mes))});
  var calif=act.filter(function(r){return(r.v[5]==='Socio comercial'||r.v[5]==='Vendedor')&&(pagos[r.v[0]]||0)>=3}).length;
  return{total:cl.length,activos:act.length,prueba:cl.filter(function(r){return r.v[3]==='Prueba'}).length,mrr:mrr,uso:uso,nUso:nUso,calif:calif}}
function distribucionReg(m){var o={};rows('distribucion').forEach(function(r){if(ymOf(r.v[1])===m)o[r.v[2]]=(o[r.v[2]]||0)+num(r.v[3])});return o}
function firstYM(){var ms=[];rows('ingresos').forEach(function(r){ms.push(ymOf(r.v[0]))});rows('gastos').forEach(function(r){ms.push(ymOf(r.v[0]))});ms=ms.filter(Boolean);var now=ym(new Date());
  return ms.length?ms.reduce(function(a,b){return a<b?a:b}):now}
/* Meses del período. Año y Todo llegan hasta el mes actual para no contar gastos fijos de meses que no pasaron. */
function perMonths(){if(PER==='mes')return[SEL];var now=ym(new Date()),start,end=now;
  var f=firstYM();if(PER==='anio'){var y=SEL.slice(0,4);start=f>y+'-01'?f:y+'-01';if(y+'-12'<end)end=y+'-12'}else start=f;
  var out=[];for(var m=start;m<=end;m=addM(m,1))out.push(m);return out}
function inPer(d){var m=ymOf(d);if(!m)return false;return PER==='mes'?m===SEL:(PER==='anio'?m.slice(0,4)===SEL.slice(0,4):true)}
function perLabel(){return PER==='mes'?mName(SEL):(PER==='anio'?SEL.slice(0,4):'todo el historial')}
/* Suma de los meses del período (los gastos fijos se cuentan mes por mes). */
function period(){var A=perMonths().map(month),o={months:A,ing:[],ingresos:0,comVend:0,comOv:0,fijos:0,variables:0,cats:{},porTipo:{},repartible:0};
  A.forEach(function(M){o.ing=o.ing.concat(M.ing);['ingresos','comVend','comOv','fijos','variables'].forEach(function(k){o[k]+=M[k]});
    Object.keys(M.cats).forEach(function(c){o.cats[c]=(o.cats[c]||0)+M.cats[c]});Object.keys(M.porTipo).forEach(function(t){o.porTipo[t]=(o.porTipo[t]||0)+M.porTipo[t]});
    o.repartible+=Math.max(M.utilidad,0)});
  o.gastos=o.fijos+o.variables;o.comisiones=o.comVend+o.comOv;o.utilidad=o.ingresos-o.comisiones-o.gastos;o.margen=o.ingresos?o.utilidad/o.ingresos:NaN;return o}
function perView(){var d=DEF[VIEW];return VIEW==='resumen'||VIEW==='comisiones'||!!(d&&(d.dateIdx!==undefined||d.monthIdx!==undefined))}
function monthsRange(){var ms=[];rows('ingresos').forEach(function(r){ms.push(ymOf(r.v[0]))});rows('gastos').forEach(function(r){ms.push(ymOf(r.v[0]))});
  ms=ms.filter(Boolean);var min=ms.length?ms.reduce(function(a,b){return a<b?a:b}):SEL,end=SEL,start=addM(end,-11);if(min>start)start=min<end?min:end;
  var out=[];for(var m=start;m<=end;m=addM(m,1))out.push(m);return out}

/* En el celular las tablas .rt se ven como tarjetas: cada celda lleva el nombre de su columna. */
function labelTables(root){root.querySelectorAll('table.rt').forEach(function(t){var hs=[].map.call(t.rows[0].cells,function(c){return c.textContent.replace(/ [↑↓]$/,'')});
  [].slice.call(t.rows,1).forEach(function(r){[].forEach.call(r.cells,function(c,j){c.setAttribute('data-label',hs[j]||'')})})})}

function render(){
  var pm=perView()?PER:'mes';
  document.getElementById('mLabel').textContent=pm==='todo'?'Todo el historial':(pm==='anio'?'Año '+SEL.slice(0,4):cap(mName(SEL)));
  document.getElementById('prevM').classList.toggle('hide',pm==='todo');document.getElementById('nextM').classList.toggle('hide',pm==='todo');navState();saveBar();
  Object.keys(charts).forEach(function(k){charts[k].destroy()});charts={};
  if(!D)return;
  if(VIEW==='resumen')return renderResumen();
  if(VIEW==='comisiones')return renderComisiones();
  if(VIEW==='config')return renderConfig();
  if(VIEW==='gastosFijos')return renderFijos();
  return renderTable(VIEW);
}
function segHTML(){return '<div class="seg" role="group" aria-label="Período">'+[['mes','Mes'],['anio','Año'],['todo','Todo']].map(function(x){return '<button type="button" data-per="'+x[0]+'" class="'+(PER===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'}
function setHero(eyebrow,title,lead,extra){document.getElementById('hero').innerHTML='<div class="hero-top"><span class="eyebrow">'+eyebrow+'</span>'+(perView()?segHTML():'')+'</div><h1>'+title+'</h1>'+(lead?'<p class="lead">'+lead+'</p>':'')+(extra||'')+tabsHTML()}
function g(l,v,s,cls){return '<div class="gcard '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'}

  var delta=mes&&P.ingresos?(M.ingresos-P.ingresos)/P.ingresos:NaN,gana=M.utilidad>=0,vacio=M.ingresos===0&&M.gastos===0;

    g('Utilidad',$m(M.utilidad),'Margen <span class="'+(M.utilidad>=0?'up':'down')+'">'+pct(M.margen)+'</span>'+(pendFijos>0.004?' · '+$m(M.utilidad-pendFijos)+' al pagar los fijos':''),'hot')+

  var v=document.getElementById('view');
  v.innerHTML='<div class="grid two"><div class="card"><div class="card-h"><div><div class="kicker">Tendencia</div><h2>Ingresos, gastos y utilidad</h2></div></div><div class="chartbox"><canvas id="chMain"></canvas></div></div>'+
    '<div class="card"><div class="kicker">Gastos · '+esc(perLabel())+'</div><h2>¿En qué se va el dinero?</h2>'+(Object.keys(M.cats).length?'<div class="chartbox" style="height:290px"><canvas id="chCats"></canvas></div>':'<div class="empty">Sin gastos en '+esc(perLabel())+'</div>')+'</div></div>'+
    '<div class="grid half mt"><div class="card">'+distribucionHTML(M)+'</div><div class="card">'+statementHTML(M)+'</div></div>';

var DKEYS=[['Reinversión','reparto_reinversion'],['Reserva','reparto_reserva'],['Gabriel','reparto_gabriel'],['Daniel','reparto_daniel']];

  busy(true);var chain=Promise.resolve();pend.forEach(function(p){chain=chain.then(function(){return call('saveRow','distribucion',null,[today(),firstDay(SEL),p[0],p[1],'Distribución de '+mName(SEL)])})});

    M.oninput=function(){var tar=num(CFG.precio_por_mensaje)||0.15,n=Math.max(0,Math.round(num(M.value)));F.f3.value=Math.round(n*tar*100)/100;F.f4.value=n?n+' mensajes × $'+tar:''};fill()}
  document.getElementById('cancel').onclick=closeForm;
  if(rec)document.getElementById('del').onclick=function(){if(!confirm('¿Eliminar este registro del Sheet?'))return;busy(true);call('deleteRow',key,row).then(function(d){setData(d);closeForm();toast('Eliminado')}).catch(err).finally(function(){busy(false)})};
  F.onsubmit=function(e){e.preventDefault();var out=def.fields.map(function(f,i){return F['f'+i].value});if(!out[0]){toast('Completá el primer campo');return}
    busy(true);call('saveRow',key,row,out).then(function(d){setData(d);closeForm();toast(pre?'Pago anotado en Gastos':'Guardado en el Sheet')}).catch(err).finally(function(){busy(false)})};
}
function closeForm(){document.getElementById('mbg').classList.remove('on')}
document.getElementById('mbg').addEventListener('click',function(e){if(e.target.id==='mbg')closeForm()});

/* ============ Configuración ============ */
// Se edita en un borrador (DRAFT) y se guarda todo junto. Los porcentajes se guardan como decimal (0.4) y se muestran como 40.
var DRAFT={};
var LOCKED={lista_tipos_ingreso:['Mensualidad','Instalación'],lista_estados:['Activo','Prueba'],lista_roles:['Fundador','Socio comercial','Vendedor'],lista_destinos:['Reinversión','Reserva','Gabriel','Daniel']};
var LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-label="Fija"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var REPARTO=[['reparto_reinversion','Reinversión','#1A1A1A'],['reparto_reserva','Reserva','#B8B0A3'],['reparto_gabriel','Gabriel','#FF4D00'],['reparto_daniel','Daniel','#FF9A6B']];
function cv(k){return Object.prototype.hasOwnProperty.call(DRAFT,k)?DRAFT[k]:CFG[k]}
function same(a,b){return String(a==null?'':a)===String(b==null?'':b)}
function setDraft(k,v){if(same(CFG[k],v))delete DRAFT[k];else DRAFT[k]=v;saveBar()}
function slug(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function listOf(k){var v=cv(k);if(v==null||String(v).trim()==='')return k.indexOf('lista_')===0?opts(k):[];return String(v).split(',').map(function(x){return x.trim()}).filter(Boolean)}
function fld(k,label,o){o=o||{};var t=o.t||'num',v=cv(k),shown=(v==null||v==='')?'':(t==='pct'?Math.round(num(v)*10000)/100:v);
  return '<label class="fld'+(o.cls?' '+o.cls:'')+'">'+(label?'<span>'+label+'</span>':'')+'<div class="inp'+(k in DRAFT?' changed':'')+'">'+(o.pre?'<i>'+o.pre+'</i>':'')+
    '<input data-k="'+esc(k)+'" data-t="'+t+'" '+(t==='text'?'type="text"':'type="number" inputmode="decimal" step="any" min="0"')+' value="'+esc(shown)+'" placeholder="'+esc(o.ph||'')+'"'+(label?'':' aria-label="'+esc(o.aria||k)+'"')+'>'+
    (o.suf?'<i>'+o.suf+'</i>':'')+'</div>'+(o.help?'<small>'+o.help+'</small>':'')+'</label>'}
function chips(k,o){o=o||{};var lock=LOCKED[k]||[];
  return '<div class="chips" data-chips="'+k+'">'+listOf(k).map(function(x,i){var lk=lock.indexOf(x)>=0;
    return '<span class="chip-x'+(lk?' lock':'')+'"'+(lk?' title="Se usa en los cálculos: no se puede quitar"':'')+'><span>'+esc(x)+'</span>'+(lk?LOCK_SVG:'<button type="button" data-rm="'+i+'" aria-label="Quitar '+esc(x)+'">×</button>')+'</span>'}).join('')+
    '<span class="chip-add"><input type="'+(o.email?'email':'text')+'" data-add="'+k+'" placeholder="'+esc(o.ph||'Agregar…')+'" autocomplete="off"><button type="button" data-addbtn="'+k+'" aria-label="Agregar">+</button></span></div>'}
function renderConfig(){
  setHero('Ajustes','Configuración<span class="dot">.</span>','Precios, comisiones, reparto y quién puede entrar. Los cambios se guardan todos juntos con el botón Guardar.','');
  var h='<div class="cfg-grid">';
  h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Planes</div><h3>Precios</h3><p class="sub">Mensualidad e instalación de cada plan. Completan solos los formularios.</p></div><div class="cfg-body">'+
    '<div class="plan-row head"><span>Plan</span><span>Mensualidad</span><span>Instalación</span></div>'+
    listOf('lista_planes').map(function(p){var k=slug(p),pm=k==='por_mensaje';return '<div class="plan-row"><b>'+esc(p)+'</b>'+
      fld('precio_'+k,'',{pre:'$',suf:pm?'c/u':'',ph:pm?'0.15':'A convenir',aria:'Mensualidad '+p})+fld('instalacion_'+k,'',{pre:'$',ph:'—',aria:'Instalación '+p})+'</div>'}).join('')+
    '<p class="note">"Por mensaje" cobra por cada mensaje enviado. Los planes se agregan o quitan en Listas.</p></div></section>';
  h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Utilidad</div><h3>Reparto</h3><p class="sub">Cómo se divide la utilidad de cada mes.</p></div><div class="cfg-body"><div class="split" id="split"></div><div class="fgrid c2">'+
    REPARTO.map(function(r){return fld(r[0],'<i class="dotc" style="background:'+r[2]+'"></i>'+r[1],{t:'pct',suf:'%'})}).join('')+'</div><div class="note" id="splitNote"></div></div></section>';
  h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Equipo comercial</div><h3>Comisiones</h3><p class="sub">Lo que se lleva quien vende. Los fundadores no cobran comisión.</p></div><div class="cfg-body"><div class="fgrid">'+
    fld('pct_instalacion_vendedor','De la instalación, para quien vende',{t:'pct',suf:'%'})+
    fld('pct_override_instalacion','Override del socio en la instalación',{t:'pct',suf:'%',help:'Sale de la parte del vendedor de su equipo.'})+
    fld('pct_override_mensual','Override del socio en cada mensualidad',{t:'pct',suf:'%'})+
    fld('meses_override','Meses que dura el override',{suf:'meses'})+
    fld('socio_comercial_nombre','Nombre del socio comercial',{t:'text',ph:'Sin asignar',cls:'wide'})+'</div></div></section>';
  h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Socio comercial</div><h3>Participación</h3><p class="sub">Parte de Abita que gana el socio al llegar a cierta cantidad de clientes activos.</p></div><div class="cfg-body">'+
    ['1','2'].map(function(n){return '<div class="tier"><span class="tier-n">Tramo '+n+'</span><div class="fgrid c2">'+fld('meta_tramo'+n+'_clientes','Clientes activos',{suf:'clientes'})+fld('meta_tramo'+n+'_pct','Participación',{t:'pct',suf:'%'})+'</div></div>'}).join('')+'</div></section>';
  h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Seguridad</div><h3>Acceso a la app</h3><p class="sub">Cuentas de Google que pueden entrar. Cualquier otra ve "no tiene acceso".</p></div><div class="cfg-body">'+chips('emails_permitidos',{email:1,ph:'correo@gmail.com'})+'</div></section>';
  h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Formularios</div><h3>Listas de opciones</h3><p class="sub">Lo que aparece en los menús al cargar algo. Las que tienen candado se usan en los cálculos y no se pueden quitar.</p></div><div class="cfg-body">'+
    LISTS.map(function(l){return '<div class="lrow"><div><b>'+esc(l[1])+'</b></div>'+chips(l[0])+'</div>'}).join('')+'</div></section>';
  var known=/^(precio_|instalacion_|pct_|reparto_|meta_tramo|lista_)|^(meses_override|socio_comercial_nombre|emails_permitidos)$/;
  var other=(D.configRows||[]).filter(function(c){return !known.test(c.key)});
  if(other.length)h+='<section class="cfg-sec"><div class="cfg-head"><div class="kicker">Otros</div><h3>Otros ajustes</h3></div><div class="cfg-body"><div class="fgrid">'+
    other.map(function(c){return fld(c.key,esc(c.key),{t:typeof c.value==='number'?'num':'text',help:esc(c.desc||'')})}).join('')+'</div></div></section>';
  document.getElementById('view').innerHTML=h+'</div>';updSplit();saveBar();
}
function updSplit(){var b=document.getElementById('split');if(!b)return;var tot=0;
  b.innerHTML=REPARTO.map(function(r){var p=Math.max(0,num(cv(r[0])));tot+=p;return '<div style="width:'+(p*100)+'%;background:'+r[2]+'" title="'+r[1]+' '+pct(p)+'"></div>'}).join('')+(tot<1?'<div class="rest" style="flex:1"></div>':'');
  var n=document.getElementById('splitNote'),ok=Math.abs(tot-1)<0.0001;
  n.className='note '+(ok?'pos':'neg');n.textContent=ok?'Suma 100%. Listo.':(tot<1?'Suma '+pct(tot)+'. Falta asignar '+pct(1-tot)+'.':'Suma '+pct(tot)+'. Sobra '+pct(tot-1)+'.')}
function saveBar(){var n=Object.keys(DRAFT).length;document.getElementById('savebar').classList.toggle('on',VIEW==='config'&&n>0);
  document.getElementById('sbN').textContent=n===1?'1 cambio sin guardar':n+' cambios sin guardar'}
(function(){var V=document.getElementById('view');
  V.addEventListener('input',function(e){var i=e.target;if(VIEW!=='config'||!i.dataset.k)return;var t=i.dataset.t,x=i.value.trim(),val;
    if(t==='text')val=i.value;else if(x==='')val='';else{val=Number(x);if(!isFinite(val))return;if(t==='pct')val=Math.round(val*100)/10000}
    setDraft(i.dataset.k,val);i.parentNode.classList.toggle('changed',i.dataset.k in DRAFT);if(/^reparto_/.test(i.dataset.k))updSplit()});
  V.addEventListener('click',function(e){if(VIEW!=='config')return;var b=e.target.closest('[data-rm],[data-addbtn]');if(!b)return;
    var box=b.closest('[data-chips]'),k=box.dataset.chips,items=listOf(k);
    if(b.dataset.rm!=null){var x=items[Number(b.dataset.rm)];
      if(items.length<=1){toast('Tiene que quedar al menos una');return}
      if(k==='emails_permitidos'&&!confirm(x+' ya no va a poder entrar a la app. ¿Quitarlo?'))return;
      items.splice(Number(b.dataset.rm),1)}
    else{var inp=box.querySelector('[data-add]'),t=inp.value.trim();if(!t){inp.focus();return}
      if(k==='emails_permitidos'){t=t.toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t)){toast('Ese correo no es válido');return}}
      if(items.some(function(y){return y.toLowerCase()===t.toLowerCase()})){toast('Ya está en la lista');return}items.push(t)}
    setDraft(k,items.join(', '));var y=window.scrollY;renderConfig();window.scrollTo(0,y);
    var n=document.querySelector('[data-add="'+k+'"]');if(n&&b.dataset.addbtn)n.focus({preventScroll:true})});
  V.addEventListener('keydown',function(e){var i=e.target;if(VIEW==='config'&&e.key==='Enter'&&i.dataset.add){e.preventDefault();i.parentNode.querySelector('[data-addbtn]').click()}});
  document.getElementById('sbUndo').onclick=function(){DRAFT={};renderConfig()};
  document.getElementById('sbSave').onclick=function(){
    var tot=REPARTO.reduce(function(a,r){return a+num(cv(r[0]))},0);
    if(Math.abs(tot-1)>0.0001){toast('El reparto suma '+pct(tot)+'. Tiene que sumar 100%.');var sp=document.getElementById('split');if(sp)sp.scrollIntoView({behavior:'smooth',block:'center'});return}
    if('emails_permitidos' in DRAFT&&!listOf('emails_permitidos').length){toast('Tiene que quedar al menos un correo con acceso');return}
    busy(true);call('saveConfig',DRAFT).then(function(d){DRAFT={};setData(d);toast('Cambios guardados')}).catch(err).finally(function(){busy(false)})}})();

/* ============ Carga ============ */
function err(e){busy(false);alert('Error: '+(e&&e.message||e))}
function setData(d){D=d;CFG=d.config||{};render()}
function load(){busy(true);call('getData').then(setData).catch(err).finally(function(){busy(false)})}
load();
</script>
</body>
